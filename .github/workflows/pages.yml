name: Build, check and publish CI Academy to GitHub Pages (gh-pages branch)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: academy/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Unit tests (math core and grading)
        run: bun test src
      - name: Render every page and step; KaTeX lint; click-through leak scan
        run: |
          bun --preload ./scripts/css-stub.ts scripts/ssr-smoke.tsx
          bun --preload ./scripts/css-stub.ts scripts/tex-lint.ts
          bun --preload ./scripts/css-stub.ts scripts/dom-leak-scan.ts
      - name: Build for Pages
        run: npm run build
        env:
          GH_PAGES: "1"
      - name: Publish academy/dist to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: academy/dist
          force_orphan: true
